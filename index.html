/* ── Reset ── */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0e1a;color:#e2e8f0;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation}

/* ── CSS Custom Properties + Safe-area defaults ── */
:root {
  --sa-t: env(safe-area-inset-top, 0px);
  --sa-b: env(safe-area-inset-bottom, 0px);
  --sa-l: env(safe-area-inset-left, 0px);
  --sa-r: env(safe-area-inset-right, 0px);

  --dialog-maxw: 800px;
  --choice-maxw: 600px;
  --hud-maxw: 1200px;
  --menu-maxw: 440px;

  --spacing-h: 24px;
  --spacing-v: 16px;
}

/* ── 3-level breakpoints ── */

/* Mobile < 375px — compact, full-width */
@media (max-width: 374px) {
  :root {
    --dialog-maxw: 100%;
    --choice-maxw: 100%;
    --hud-maxw: 100%;
    --menu-maxw: calc(100vw - 32px);
    --spacing-h: 12px;
    --spacing-v: 10px;
  }
}

/* 375px — 767px (手机竖屏) */
@media (min-width: 375px) and (max-width: 767px) {
  :root {
    --dialog-maxw: 100%;
    --choice-maxw: 100%;
    --hud-maxw: 100%;
    --menu-maxw: calc(100vw - 40px);
    --spacing-h: 16px;
    --spacing-v: 14px;
  }
}

/* 768px — 1279px (平板) */
@media (min-width: 768px) and (max-width: 1279px) {
  :root {
    --dialog-maxw: min(720px, 90vw);
    --choice-maxw: min(560px, 85vw);
    --hud-maxw: 100%;
    --menu-maxw: 420px;
    --spacing-h: 32px;
    --spacing-v: 16px;
  }
}

/* 1280px+ (桌面) */
@media (min-width: 1280px) {
  :root {
    --dialog-maxw: 800px;
    --choice-maxw: 600px;
    --hud-maxw: 1200px;
    --menu-maxw: 440px;
    --spacing-h: max(4vw, 32px);
    --spacing-v: 16px;
  }
}

/* ── Title screen ── */
#title-screen {
  padding: env(safe-area-inset-top, 20px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 20px) env(safe-area-inset-left, 0px);
}

/* ── DialogBox responsive ── */
.dialogbox-wrapper {
  padding-left: max(var(--spacing-h), env(safe-area-inset-left, 16px));
  padding-right: max(var(--spacing-h), env(safe-area-inset-right, 16px));
  padding-bottom: max(var(--spacing-v), env(safe-area-inset-bottom, 16px));
}
.dialogbox-bubble { max-width: var(--dialog-maxw); }

/* ── ChoicePanel responsive ── */
.choicepanel-wrapper {
  padding-left: max(var(--spacing-h), env(safe-area-inset-left, 16px));
  padding-right: max(var(--spacing-h), env(safe-area-inset-right, 16px));
  padding-bottom: max(10vh, 80px, env(safe-area-inset-bottom, 16px));
}
.choicepanel-container { max-width: var(--choice-maxw); }

/* ── HUD responsive ── */
.hud-wrapper {
  padding-left: max(var(--spacing-h), env(safe-area-inset-left, 24px));
  padding-right: max(var(--spacing-h), env(safe-area-inset-right, 24px));
  padding-top: env(safe-area-inset-top, 0px);
}
.hud-inner { max-width: var(--hud-maxw); margin: 0 auto; }

@media (max-width: 374px) {
  .hud-chapter { font-size: 10px; }
  .hud-scene { font-size: 10px; }
  .hud-dot { width: 8px; height: 8px; }
}

/* ── MenuUI responsive ── */
.menu-panel {
  width: min(var(--menu-maxw), calc(100vw - 32px));
  max-height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 40px);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.menu-toggle-btn {
  right: max(4vw, 20px, env(safe-area-inset-right, 20px));
  top: max(6px, env(safe-area-inset-top, 6px));
}

@media (max-width: 374px) {
  .menu-panel { padding: 16px; border-radius: 10px; }
}

/* ── Scrollbar styling (menu panel) ── */
.menu-panel::-webkit-scrollbar { width: 4px; }
.menu-panel::-webkit-scrollbar-track { background: transparent; }
.menu-panel::-webkit-scrollbar-thumb { background: rgba(129,140,248,0.25); border-radius: 2px; }

/* ── DialogText responsive ── */
@media (max-width: 374px) {
  .dialogbox-text { font-size: 15px; }
  .dialogbox-speaker { margin-bottom: 6px; }
}

<script type="module">// core/FlagSystem.js
function FlagSystem() {
  const state = {
    // 6 核心变量
    village_trust: 0,
    star_understanding: 0,
    knew_previous: false,
    sided_with: "none",
    has_star_ember: false,
    truth_revealed: false,
    // 3 好感度
    affection_kael: 0,
    affection_marcus: 0,
    affection_lyra: 0,
    // 道具旗标（v2.0 3件关键道具）
    item_star_ember: false,
    item_old_cloak: false,
    item_kael_watch: false
  };
  const listeners = {};
  function onChange(key, val) {
    (listeners.change || []).forEach((fn) => fn({ key, value: val }));
  }
  return {
    /** 获取任意旗标值 */
    getFlag(key) {
      return state[key];
    },
    /** 设置旗标值，触发 change 事件 */
    setFlag(key, val) {
      const old = state[key];
      state[key] = val;
      if (old !== val) onChange(key, val);
    },
    /** 检查旗标是否等于指定值（=== 比较） */
    hasFlag(key, val) {
      return state[key] === val;
    },
    /** 获取角色好感度 */
    getAffection(charId) {
      const key = "affection_" + charId;
      return state[key] !== void 0 ? state[key] : 0;
    },
    /** 增加/减少好感度，返回新值 */
    addAffection(charId, delta) {
      const key = "affection_" + charId;
      const current = state[key] !== void 0 ? state[key] : 0;
      const next = Math.max(0, Math.min(10, current + delta));
      state[key] = next;
      onChange(key, next);
      return next;
    },
    /** 获取完整状态快照（用于存档） */
    getSnapshot() {
      return { ...state };
    },
    /** 从快照恢复状态（用于读档） */
    restoreSnapshot(snapshot) {
      Object.keys(snapshot).forEach((k) => {
        state[k] = snapshot[k];
      });
    },
    /**
     * 条件表达式求值
     * 支持的语法:
     *   "flag_xxx === true"
     *   "flag_xxx === false"
     *   "flag_xxx === 3"
     *   "affection_kael >= 5"
     *   "hasStarEmber"  (简写，等价于 flag_has_star_ember === true)
     *   "affection_lyra > 0"
     *   "flag_knew_previous === true"
     *   "flag_sided_with === \"kael\""
     *
     * 返回 boolean
     */
    evaluateCondition(expr) {
      if (!expr || expr === "true") return true;
      if (expr === "false") return false;
      if (/^[a-z][a-zA-Z0-9_]*$/.test(expr) && !expr.includes(" ")) {
        const val = state[expr];
        return val === true || val === 1 || val === "1";
      }
      const match = expr.match(
        /^(flag_)?([a-zA-Z_]\w*)\s*(==|===|!==|!=|>=|<=|>|<)\s*(.+)$/
      );
      if (!match) {
        console.warn("[FlagSystem] \u65E0\u6CD5\u89E3\u6790\u6761\u4EF6:", expr);
        return false;
      }
      const key = match[2];
      const op = match[3];
      let right = match[4].trim();
      let rVal;
      if (right === "true") rVal = true;
      else if (right === "false") rVal = false;
      else if (/^\d+$/.test(right)) rVal = parseInt(right, 10);
      else if (/^"(.+)"$/.test(right)) rVal = RegExp.$1;
      else rVal = right;
      const lVal = state[key];
      switch (op) {
        case "===":
        case "==":
          return lVal === rVal;
        case "!==":
        case "!=":
          return lVal !== rVal;
        case ">=":
          return lVal >= rVal;
        case "<=":
          return lVal <= rVal;
        case ">":
          return lVal > rVal;
        case "<":
          return lVal < rVal;
        default:
          return false;
      }
    },
    /** 订阅状态变化 */
    onChange(fn) {
      if (!listeners.change) listeners.change = [];
      listeners.change.push(fn);
      return () => {
        listeners.change = (listeners.change || []).filter((f) => f !== fn);
      };
    }
  };
}

// core/SceneManager.js
function SceneManager({ scenes, container }) {
  const SCENES2 = scenes || {};
  let currentSceneId = null;
  let currentScene = null;
  const bgLayer = document.createElement("div");
  Object.assign(bgLayer.style, {
    position: "fixed",
    inset: "0",
    zIndex: "1",
    transition: "opacity 0.3s ease, background 0.8s ease",
    pointerEvents: "none"
  });
  const overlay = document.createElement("div");
  Object.assign(overlay.style, {
    position: "fixed",
    inset: "0",
    zIndex: "40",
    pointerEvents: "none",
    opacity: "0",
    transition: "opacity 0.3s ease",
    background: "#0a0e1a"
  });
  const root = container || document.body;
  root.insertBefore(bgLayer, root.firstChild);
  root.appendChild(overlay);
  function applyBackground(scene) {
    if (!scene) return;
    const colors = scene.bg_color || ["#0a0e1a", "#1a2332"];
    bgLayer.style.background = `radial-gradient(ellipse at center, ${colors[0]} 0%, ${colors[1]} 100%)`;
  }
  function updateMeta(scene) {
    document.title = `\u661F\u843D\u4E4B\u591C \u2014 ${scene.name || ""}`;
  }
  const eventHandlers = {};
  function emit(event, data) {
    (eventHandlers[event] || []).forEach((h) => {
      try {
        h(data);
      } catch (e) {
        console.error("[SceneManager] \u4E8B\u4EF6\u9519\u8BEF:", e);
      }
    });
  }
  const api = {
    /** DOM 层引用（供外部样式覆盖） */
    bgLayer,
    overlay,
    /**
     * 切换场景
     * @param {string} sceneId
     * @param {Object} [transition]
     * @param {string} [transition.type='fade'] - 过渡类型
     * @param {number} [transition.duration=400] - 过渡时长 (ms)
     * @param {Function} [transition.onComplete] - 过渡完成回调
     */
    switchScene(sceneId, transition = {}) {
      const scene = SCENES2[sceneId];
      if (!scene) {
        console.error(`[SceneManager] \u573A\u666F\u4E0D\u5B58\u5728: ${sceneId}`);
        return;
      }
      const type = transition.type || "fade";
      const duration = transition.duration || 400;
      const prevSceneId = currentSceneId;
      const prevScene = currentScene;
      emit("beforeSwitch", {
        from: prevSceneId,
        to: sceneId,
        transition: type
      });
      overlay.style.transition = `opacity ${duration}ms ease`;
      overlay.style.opacity = "1";
      overlay.style.background = "#0a0e1a";
      setTimeout(() => {
        currentSceneId = sceneId;
        currentScene = scene;
        applyBackground(scene);
        updateMeta(scene);
        overlay.style.opacity = "0";
        setTimeout(() => {
          emit("afterSwitch", {
            from: prevSceneId,
            to: sceneId,
            scene
          });
          if (transition.onComplete) transition.onComplete(scene);
        }, duration);
      }, duration);
    },
    /**
     * 立即切换到场景（无过渡动画）
     * @param {string} sceneId
     */
    setScene(sceneId) {
      const scene = SCENES2[sceneId];
      if (!scene) {
        console.error(`[SceneManager] \u573A\u666F\u4E0D\u5B58\u5728: ${sceneId}`);
        return;
      }
      currentSceneId = sceneId;
      currentScene = scene;
      applyBackground(scene);
      updateMeta(scene);
      overlay.style.opacity = "0";
      emit("afterSwitch", {
        from: currentSceneId,
        to: sceneId,
        scene,
        instant: true
      });
    },
    /**
     * 获取当前场景 ID
     * @returns {string|null}
     */
    getCurrentSceneId() {
      return currentSceneId;
    },
    /**
     * 获取当前场景定义
     * @returns {Object|null}
     */
    getCurrentScene() {
      return currentScene || null;
    },
    /**
     * 获取场景定义
     * @param {string} sceneId
     * @returns {Object|undefined}
     */
    getScene(sceneId) {
      return SCENES2[sceneId];
    },
    /**
     * 获取所有场景名称列表
     * @returns {Array<{id, name}>}
     */
    getSceneList() {
      return Object.keys(SCENES2).map((id) => ({
        id,
        name: SCENES2[id].name || id
      }));
    },
    /**
     * 淡入动画（用于标题画面等）
     * @param {number} duration - 毫秒
     */
    fadeIn(duration = 500) {
      overlay.style.transition = `opacity ${duration}ms ease`;
      overlay.style.opacity = "0";
    },
    /**
     * 淡出到黑
     * @param {number} duration
     * @param {Function} onComplete
     */
    fadeOut(duration = 500, onComplete) {
      overlay.style.transition = `opacity ${duration}ms ease`;
      overlay.style.opacity = "1";
      overlay.style.background = "#0a0e1a";
      if (onComplete) setTimeout(onComplete, duration);
    },
    /**
     * 设置自定义渐变背景（临时覆盖场景背景）
     * @param {string} gradientCSS - CSS gradient value
     * @param {number} [duration=400]
     */
    setBackground(gradientCSS, duration = 400) {
      bgLayer.style.transition = `background ${duration}ms ease`;
      bgLayer.style.background = gradientCSS;
    },
    /**
     * 重置到默认场景背景
     */
    resetBackground() {
      if (currentScene) {
        applyBackground(currentScene);
      }
    },
    /** 事件订阅 */
    on(event, handler) {
      if (!eventHandlers[event]) eventHandlers[event] = [];
      eventHandlers[event].push(handler);
      return () => {
        eventHandlers[event] = (eventHandlers[event] || []).filter(
          (h) => h !== handler
        );
      };
    },
    /**
     * 清理 DOM 挂载
     */
    destroy() {
      if (bgLayer.parentNode) bgLayer.parentNode.removeChild(bgLayer);
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
      eventHandlers.length = 0;
    }
  };
  const sceneIds = Object.keys(SCENES2);
  if (sceneIds.length > 0) {
    api.setScene(sceneIds[0]);
  }
  return api;
}

// core/SaveManager.js
function SaveManager({ flags: flags2, storageKey = "starnight_save" }) {
  const STORAGE_KEY = storageKey;
  const MAX_SLOTS = 3;
  function getStore() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch {
      return {};
    }
  }
  function writeStore(data) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {
      console.error("[SaveManager] \u5199\u5165\u5B58\u50A8\u5931\u8D25:", e);
    }
  }
  function makeSaveData(currentNodeId, sceneId, sceneName, nodePreview) {
    const snapshot = flags2.getSnapshot();
    const affection = {
      kael: snapshot.affection_kael || 0,
      marcus: snapshot.affection_marcus || 0,
      lyra: snapshot.affection_lyra || 0
    };
    const coreFlags = {
      village_trust: snapshot.village_trust,
      star_understanding: snapshot.star_understanding,
      knew_previous: snapshot.knew_previous,
      sided_with: snapshot.sided_with,
      has_star_ember: snapshot.has_star_ember,
      truth_revealed: snapshot.truth_revealed
    };
    return {
      flags: coreFlags,
      affection,
      fullSnapshot: snapshot,
      currentNodeId: currentNodeId || "",
      sceneId: sceneId || "",
      sceneName: sceneName || "",
      nodePreview: nodePreview || "",
      timestamp: Date.now(),
      version: "2.0"
    };
  }
  return {
    /**
     * 手动保存到指定槽位
     * @param {number|string} slot - 1, 2, 3 或 'auto'
     * @param {Object} context - 存档上下文
     * @param {string} context.currentNodeId
     * @param {string} context.sceneId
     * @param {string} [context.sceneName]
     * @param {string} [context.nodePreview] - 对话文本预览（前20字）
     */
    save(slot, context) {
      if (slot === "auto") {
        return this.autoSave(context);
      }
      const numSlot = parseInt(slot, 10);
      if (isNaN(numSlot) || numSlot < 1 || numSlot > MAX_SLOTS) {
        console.warn(`[SaveManager] \u65E0\u6548\u5B58\u6863\u4F4D: ${slot}`);
        return false;
      }
      const store = getStore();
      store[String(numSlot)] = makeSaveData(
        context.currentNodeId,
        context.sceneId,
        context.sceneName,
        context.nodePreview
      );
      writeStore(store);
      return true;
    },
    /**
     * 从指定槽位读取存档
     * @param {number|string} slot
     * @returns {Object|null} 存档数据或 null
     */
    load(slot) {
      const store = getStore();
      const data = store[String(slot)];
      if (!data) return null;
      if (data.fullSnapshot) {
        flags2.restoreSnapshot(data.fullSnapshot);
      } else if (data.flags) {
        Object.keys(data.flags).forEach((k) => {
          flags2.setFlag(k, data.flags[k]);
        });
        if (data.affection) {
          Object.keys(data.affection).forEach((charId) => {
            const key = "affection_" + charId;
            flags2.setFlag(key, data.affection[charId]);
          });
        }
      }
      return data;
    },
    /**
     * 自动存档 (slot: 'auto')
     * @param {Object} context
     */
    autoSave(context) {
      const store = getStore();
      store["auto"] = makeSaveData(
        context.currentNodeId,
        context.sceneId,
        context.sceneName,
        context.nodePreview
      );
      writeStore(store);
      return true;
    },
    /**
     * 获取所有存档位列表（含缩略信息）
     * @returns {Array<{slot: string, timestamp: number, sceneName: string, nodePreview: string, exists: boolean}>}
     */
    getSaveList() {
      const store = getStore();
      const list = [];
      for (let i = 1; i <= MAX_SLOTS; i++) {
        const data = store[String(i)];
        list.push({
          slot: String(i),
          exists: !!data,
          timestamp: data ? data.timestamp : 0,
          sceneName: data ? data.sceneName || "\u672A\u77E5\u573A\u666F" : "",
          nodePreview: data ? (data.nodePreview || "").slice(0, 30) : "",
          affection: data ? data.affection : null,
          currentNodeId: data ? data.currentNodeId : null,
          sceneId: data ? data.sceneId : null
        });
      }
      const auto = store["auto"];
      list.push({
        slot: "auto",
        label: "\u81EA\u52A8\u5B58\u6863",
        exists: !!auto,
        timestamp: auto ? auto.timestamp : 0,
        sceneName: auto ? auto.sceneName || "\u672A\u77E5\u573A\u666F" : "",
        nodePreview: auto ? (auto.nodePreview || "").slice(0, 30) : "",
        affection: auto ? auto.affection : null,
        currentNodeId: auto ? auto.currentNodeId : null,
        sceneId: auto ? auto.sceneId : null
      });
      return list;
    },
    /**
     * 删除指定存档
     * @param {number|string} slot
     */
    deleteSave(slot) {
      const store = getStore();
      delete store[String(slot)];
      writeStore(store);
    },
    /**
     * 格式化时间戳
     * @param {number} ts
     * @returns {string}
     */
    formatTimestamp(ts) {
      if (!ts) return "\u2014";
      const d = new Date(ts);
      const pad = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(
        d.getDate()
      )} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    },
    /**
     * 清除所有存档
     */
    clearAll() {
      localStorage.removeItem(STORAGE_KEY);
    },
    /**
     * 检查指定槽位是否有存档
     * @param {number|string} slot
     * @returns {boolean}
     */
    hasSave(slot) {
      const store = getStore();
      return !!store[String(slot)];
    }
  };
}

// core/DialogueEngine.js
function DialogueEngine({ flags: flags2 }) {
  const nodeMap = /* @__PURE__ */ new Map();
  let currentNode = null;
  let currentNodeId = null;
  let typingBuffer = "";
  let typingIndex = 0;
  let typingActive = false;
  let typingSpeed = 50;
  let typingTimer = null;
  const eventHandlers = {};
  function on(event, handler) {
    if (!eventHandlers[event]) eventHandlers[event] = [];
    eventHandlers[event].push(handler);
    return () => {
      eventHandlers[event] = (eventHandlers[event] || []).filter(
        (h) => h !== handler
      );
    };
  }
  function emit(event, data) {
    (eventHandlers[event] || []).forEach((h) => {
      try {
        h(data);
      } catch (e) {
        console.error(`[DialogueEngine] \u4E8B\u4EF6\u5904\u7406\u5668\u9519\u8BEF (${event}):`, e);
      }
    });
  }
  function tickTyping() {
    if (typingIndex < typingBuffer.length) {
      const ch = typingBuffer[typingIndex];
      typingIndex++;
      emit("typingChar", {
        char: ch,
        progress: typingIndex / typingBuffer.length,
        fullText: typingBuffer
      });
    }
    if (typingIndex >= typingBuffer.length) {
      stopTyping();
    }
  }
  function startTyping(text) {
    stopTyping();
    typingBuffer = text || "";
    typingIndex = 0;
    typingActive = true;
    typingTimer = setInterval(tickTyping, typingSpeed);
    emit("typingChar", {
      char: "",
      progress: 0,
      fullText: typingBuffer
    });
  }
  function stopTyping() {
    if (typingTimer) {
      clearInterval(typingTimer);
      typingTimer = null;
    }
    typingActive = false;
    typingIndex = typingBuffer.length;
  }
  function applyEffects(effects) {
    if (!effects || typeof effects !== "object") return;
    const affChanges = [];
    Object.keys(effects).forEach((k) => {
      const val = effects[k];
      if (k.startsWith("affection_")) {
        const charId = k.replace("affection_", "");
        if (typeof val === "number") {
          const newVal = flags2.addAffection(charId, val);
          affChanges.push({ charId, delta: val, newVal });
        }
      } else {
        flags2.setFlag(k, val);
      }
    });
    return affChanges;
  }
  function enterNode(node) {
    if (!node) {
      console.warn("[DialogueEngine] enterNode: \u8282\u70B9\u4E3A\u7A7A");
      return;
    }
    currentNode = node;
    currentNodeId = node.id;
    if (node.effect) {
      applyEffects(node.effect);
    }
    if (node.scene) {
      emit("sceneChange", node.scene);
    }
    emit("nodeStart", {
      id: node.id,
      speaker: node.speaker || null,
      text: node.text || "",
      mode: node.mode || "dialogue"
    });
    startTyping(node.text || "");
    return node;
  }
  const api = {
    /**
     * 加载对话节点列表
     * @param {Array} nodes - 节点数组
     */
    loadDialogue(nodes) {
      nodeMap.clear();
      if (Array.isArray(nodes)) {
        nodes.forEach((n) => {
          if (n && n.id) nodeMap.set(n.id, n);
        });
      }
    },
    /**
     * 开始对话（从指定节点）
     * @param {string} nodeId
     */
    start(nodeId) {
      const node = nodeMap.get(nodeId);
      if (!node) {
        console.error(`[DialogueEngine] \u8D77\u59CB\u8282\u70B9\u4E0D\u5B58\u5728: ${nodeId}`);
        return;
      }
      enterNode(node);
    },
    /**
     * 获取当前对话节点
     * @returns {Object|null}
     */
    getCurrentNode() {
      return currentNode || null;
    },
    /**
     * 获取指定节点
     * @param {string} nodeId
     * @returns {Object|undefined}
     */
    getNode(nodeId) {
      return nodeMap.get(nodeId);
    },
    /**
     * 玩家选择选项
     * @param {number} index - 选项索引（在可用选项中）
     * @returns {boolean} 是否成功跳转
     */
    selectChoice(index) {
      const choices = api.getAvailableChoices();
      if (index < 0 || index >= choices.length) {
        console.warn(`[DialogueEngine] \u65E0\u6548\u9009\u9879\u7D22\u5F15: ${index}`);
        return false;
      }
      const choice = choices[index];
      emit("choice", {
        choiceIndex: index,
        choiceText: choice.text,
        nextNodeId: choice.next,
        effects: choice.effects || null
      });
      const affChanges = applyEffects(choice.effects);
      if (choice.next) {
        const nextNode = nodeMap.get(choice.next);
        if (nextNode) {
          emit("nodeEnd", {
            nodeId: currentNodeId,
            nextNodeId: choice.next,
            choiceIndex: index,
            affectionChanges: affChanges || []
          });
          enterNode(nextNode);
          return true;
        } else {
          console.error(
            `[DialogueEngine] \u8DF3\u8F6C\u76EE\u6807\u8282\u70B9\u4E0D\u5B58\u5728: ${choice.next}`
          );
        }
      } else {
        emit("nodeEnd", {
          nodeId: currentNodeId,
          nextNodeId: null,
          choiceIndex: index,
          affectionChanges: affChanges || [],
          isEnd: true
        });
        currentNode = null;
        currentNodeId = null;
        return true;
      }
      return false;
    },
    /**
     * 获取当前可用的选项列表（已过滤条件）
     * @returns {Array<{text, next, condition, effects}>}
     */
    getAvailableChoices() {
      if (!currentNode || !currentNode.choices) return [];
      return currentNode.choices.filter((c) => {
        if (!c.condition) return true;
        if (typeof c.condition === "function") return c.condition(flags2);
        return flags2.evaluateCondition(c.condition);
      });
    },
    /**
     * 获取打字机下一个字符（用于外部 UI 消费）
     * @returns {{char: string, done: boolean}}
     */
    getChar() {
      if (!typingActive) {
        return { char: "", done: true };
      }
      if (typingIndex < typingBuffer.length) {
        const ch = typingBuffer[typingIndex];
        typingIndex++;
        return { char: ch, done: false };
      }
      stopTyping();
      return { char: "", done: true };
    },
    /**
     * 是否正在打字
     * @returns {boolean}
     */
    isTyping() {
      return typingActive;
    },
    /**
     * 跳过打字，立即显示完整文本
     */
    skipTyping() {
      if (!typingActive) return;
      stopTyping();
      typingIndex = typingBuffer.length;
      emit("typingChar", {
        char: "",
        progress: 1,
        fullText: typingBuffer,
        skipped: true
      });
    },
    /**
     * 打字完成百分比
     * @returns {number} 0~1
     */
    getTypingProgress() {
      if (typingBuffer.length === 0) return 1;
      return typingIndex / typingBuffer.length;
    },
    /** 事件注册 */
    on,
    /** 事件发射 */
    emit,
    /** 手动设置打字速度 (ms/char) */
    setTypingSpeed(ms) {
      typingSpeed = Math.max(10, ms);
      if (typingActive) {
        clearInterval(typingTimer);
        typingTimer = setInterval(tickTyping, typingSpeed);
      }
    },
    /**
     * 跳转到指定节点（无打字效果，直接切换）
     * @param {string} nodeId
     */
    jump(nodeId) {
      const node = nodeMap.get(nodeId);
      if (!node) {
        console.error(`[DialogueEngine] \u8DF3\u8F6C\u76EE\u6807\u4E0D\u5B58\u5728: ${nodeId}`);
        return;
      }
      stopTyping();
      emit("nodeEnd", {
        nodeId: currentNodeId,
        nextNodeId: nodeId,
        isJump: true
      });
      enterNode(node);
    },
    /**
     * 重新加载当前节点
     */
    reload() {
      if (currentNodeId) {
        enterNode(nodeMap.get(currentNodeId));
      }
    },
    /**
     * 获取节点总数
     */
    getNodeCount() {
      return nodeMap.size;
    },
    /**
     * 获取指定场景的所有节点ID列表
     * @param {string} sceneId
     * @returns {string[]}
     */
    getNodesByScene(sceneId) {
      const ids = [];
      nodeMap.forEach((n, id) => {
        if (n.scene === sceneId) ids.push(id);
      });
      return ids;
    }
  };
  return api;
}

  }
  const api = {
    /** DOM 根元素 */
    element: wrapper,
    /** 显示对话框 */
    show() {
      isVisible = true;
      wrapper.style.display = "block";
      wrapper.offsetHeight;
      wrapper.style.opacity = "1";
    },
    /**
     * 开始显示节点对话数据（由 main.js 在 nodeStart 时调用）
     * @param {Object} nodeData - 节点数据 { id, speaker, text, mode }
     */
    startNode(nodeData) {
      if (!nodeData) return;
      this.show();
      this.typeText(nodeData.text || "", nodeData.speaker || null, nodeData.mode || "dialogue");
    },
    /** 隐藏对话框 */
    hide() {
      isVisible = false;
      clearTypingBuffer();
      wrapper.style.opacity = "0";
      setTimeout(() => {
        if (!isVisible) wrapper.style.display = "none";
      }, 300);
    },
    /** 设置模式 */
    setMode(newMode) {
      mode = newMode;
      textEl.style.fontStyle = mode === "inner_monologue" ? "italic" : "normal";
      textEl.style.opacity = mode === "inner_monologue" ? "0.85" : "1";
    },
    /** 设置说话者，null = 旁白 */
    setSpeaker(speakerId) {
      if (!speakerId || !CHARACTERS2[speakerId]) {
        currentSpeaker = null;
        speakerRow.style.display = "none";
        avatarEl.textContent = "";
        nameEl.textContent = "";
        this.setMode("narration");
        return;
      }
      const char = CHARACTERS2[speakerId];
      currentSpeaker = { id: speakerId, ...char };
      speakerRow.style.display = "flex";
      avatarEl.textContent = char.emoji || "\u2728";
      avatarEl.style.background = char.color ? `${char.color}22` : "rgba(129, 140, 248, 0.15)";
      avatarEl.style.borderColor = char.color ? `${char.color}44` : "rgba(129, 140, 248, 0.25)";
      nameEl.textContent = char.name || speakerId;
      nameEl.style.color = char.color || "#a5b4fc";
      this.setMode("dialogue");
    },
    /**
     * 开始打字输出
     * @param {string} text — 完整文本
     * @param {string|null} speakerId — 说话者ID，null=旁白
     * @param {string} [modeOverride] — 可选模式覆盖
     */
    typeText(text, speakerId, modeOverride) {
      clearTypingBuffer();
      textEl.textContent = "";
      typingBuffer = text || "";
      typingProgress = 0;
      isTypingActive = true;
      if (modeOverride) {
        this.setMode(modeOverride);
      }
      this.setSpeaker(speakerId);
      if (!speakerId) {
        textEl.style.textAlign = "center";
        textEl.style.color = "#94a3b8";
      } else {
        textEl.style.textAlign = "left";
        textEl.style.color = "#e2e8f0";
      }
      updateIndicator(true);
      textEl.textContent = "";
    },
    /** 立即完成打字（不触发 nodeEnd） */
    skipTyping() {
      if (!isTypingActive) return;
      clearTypingBuffer();
      textEl.textContent = typingBuffer;
      updateIndicator(false);
    },
    /** 显示指定进度的文本（由引擎 typingChar 事件驱动） */
    setTypingProgress(progress, fullText) {
      if (!isTypingActive) return;
      typingProgress = progress;
      typingBuffer = fullText || typingBuffer;
      const charsToShow = Math.floor(typingBuffer.length * progress);
      textEl.textContent = typingBuffer.slice(0, charsToShow);
      if (progress >= 1) {
        clearTypingBuffer();
        updateIndicator(false);
      }
    },
    /** 清空内容 */
    clear() {
      clearTypingBuffer();
      textEl.textContent = "";
      updateIndicator(false);
    },
    /** 销毁，清理事件和DOM */
    destroy() {
      clearTypingBuffer();
      cleanupFns.forEach((fn) => fn());
      cleanupFns.length = 0;
      if (wrapper.parentNode) {
        wrapper.parentNode.removeChild(wrapper);
      }
    },
    /** 是否正在打字 */
    get isTyping() {
      return isTypingActive;
    },
    /** 当前是否可见 */
    get showing() {
      return isVisible;
    }
  };
  if (engine2 && engine2.on) {
    const offNodeStart = engine2.on("nodeStart", (node) => {
      if (node && node.text !== void 0) {
        api.typeText(node.text, node.speaker || null, node.mode);
      }
    });
    cleanupFns.push(offNodeStart);
    const offTypingChar = engine2.on("typingChar", (data) => {
      if (data && data.progress !== void 0) {
        api.setTypingProgress(data.progress, data.fullText);
      }
    });
    cleanupFns.push(offTypingChar);
  }
  if (render) {
    render(wrapper, document.body);
  }
  return api;
}

// ui/ChoicePanel.js
function ChoicePanel(opts) {
  const { render, engine: engine2, evaluateCondition } = opts;
  const cleanupFns = [];
  let choices = [];
  let isAnimating = false;
  let isVisible = false;
  const wrapper = document.createElement("div");
  wrapper.className = "choicepanel-wrapper";
  Object.assign(wrapper.style, {
    position: "fixed",
    bottom: "0",
    left: "0",
    right: "0",
    zIndex: "45",
    pointerEvents: "none",
    display: "none",
    opacity: "0",
    transition: "opacity 0.3s ease"
  });
  const container = document.createElement("div");
  container.className = "choicepanel-container";
  Object.assign(container.style, {
    margin: "0 auto",
    display: "flex",
    flexDirection: "column",
    gap: "6px"
  });
  wrapper.appendChild(container);
  function createChoiceItem(choice, index) {
    const isAvailable = choice.condition ? evaluateCondition ? evaluateCondition(choice.condition) : false : true;
    const item = document.createElement("div");
    item.className = "choicepanel-item";
    item.dataset.index = index;
    item.dataset.available = isAvailable ? "true" : "false";
    Object.assign(item.style, {
      display: "flex",
      alignItems: "center",
      gap: "12px",
      padding: "12px 16px",
      borderRadius: "10px",
      background: isAvailable ? "rgba(26, 35, 50, 0.75)" : "rgba(26, 35, 50, 0.4)",
      backdropFilter: "blur(8px)",
      WebkitBackdropFilter: "blur(8px)",
      border: isAvailable ? "1px solid rgba(129, 140, 248, 0.2)" : "1px solid rgba(100, 116, 139, 0.15)",
      cursor: isAvailable ? "pointer" : "not-allowed",
      transition: "all 0.25s ease",
      opacity: isAvailable ? "1" : "0.45",
      pointerEvents: isAvailable ? "auto" : "none",
      userSelect: "none"
    });
    const star = document.createElement("span");
    star.className = "choicepanel-star";
    Object.assign(star.style, {
      fontSize: "14px",
      color: isAvailable ? "#fbbf24" : "#475569",
      width: "20px",
      textAlign: "center",
      flexShrink: "0",
      transition: "transform 0.3s ease, color 0.3s ease"
    });
    star.textContent = "\u2726";
    item.appendChild(star);
    const text = document.createElement("span");
    text.className = "choicepanel-text";
    Object.assign(text.style, {
      fontSize: "15px",
      lineHeight: "1.5",
      color: isAvailable ? "#e2e8f0" : "#64748b",
      fontFamily: "system-ui, sans-serif",
      flex: "1"
    });
    text.textContent = choice.text;
    item.appendChild(text);
    if (isAvailable) {
      item.addEventListener("mouseenter", () => {
        item.style.background = "rgba(99, 102, 241, 0.25)";
        item.style.borderColor = "rgba(99, 102, 241, 0.4)";
        star.style.transform = "scale(1.3)";
        star.style.color = "#f59e0b";
      });
      item.addEventListener("mouseleave", () => {
        item.style.background = "rgba(26, 35, 50, 0.75)";
        item.style.borderColor = "rgba(129, 140, 248, 0.2)";
        star.style.transform = "scale(1)";
        star.style.color = "#fbbf24";
      });
      item.addEventListener("touchstart", () => {
        item.style.background = "rgba(99, 102, 241, 0.25)";
        item.style.borderColor = "rgba(99, 102, 241, 0.4)";
        star.style.transform = "scale(1.3)";
        star.style.color = "#f59e0b";
      }, { passive: true });
      item.addEventListener("touchend", () => {
        item.style.background = "rgba(26, 35, 50, 0.75)";
        item.style.borderColor = "rgba(129, 140, 248, 0.2)";
        star.style.transform = "scale(1)";
        star.style.color = "#fbbf24";
      }, { passive: true });
      item.addEventListener("click", () => {
        if (isAnimating) return;
        selectChoice(index);
      });
    }
    return item;
  }
  function selectChoice(index) {
    if (isAnimating) return;
    isAnimating = true;
    const choice = choices[index];
    if (!choice) return;
    const items = container.querySelectorAll(".choicepanel-item");
    const selectedItem = items[index];
    if (!selectedItem) return;
    const star = selectedItem.querySelector(".choicepanel-star");
    if (star) {
      star.style.transform = "scale(1.8)";
      star.style.color = "#fbbf24";
      star.style.textShadow = "0 0 12px #fbbf24";
    }
    selectedItem.style.background = "rgba(99, 102, 241, 0.3)";
    selectedItem.style.borderColor = "#fbbf24";
    items.forEach((item, i) => {
      if (i !== index) {
        item.style.opacity = "0.2";
        item.style.transform = "translateX(-10px)";
      }
    });
    setTimeout(() => {
      wrapper.style.opacity = "0";
      setTimeout(() => {
        if (engine2 && engine2.selectChoice) {
          engine2.selectChoice(index);
        }
        isAnimating = false;
      }, 250);
    }, 400);
  }
  const api = {
    element: wrapper,
    /** 显示选项 */
    show(newChoices) {
      choices = newChoices || [];
      if (choices.length > 4) {
        choices = choices.slice(0, 4);
      }
      container.innerHTML = "";
      choices.forEach((c, i) => {
        container.appendChild(createChoiceItem(c, i));
      });
      isAnimating = false;
      isVisible = true;
      wrapper.style.display = "block";
      wrapper.offsetHeight;
      wrapper.style.opacity = "1";
    },
    /** 隐藏 */
    hide() {
      isVisible = false;
      wrapper.style.opacity = "0";
      setTimeout(() => {
        if (!isVisible) wrapper.style.display = "none";
        container.innerHTML = "";
      }, 300);
    },
    /** 刷新条件（重新计算可用性） */
    refreshConditions() {
      const items = container.querySelectorAll(".choicepanel-item");
      items.forEach((item, i) => {
        const choice = choices[i];
        if (!choice) return;
        const wasAvailable = item.dataset.available === "true";
        const isAvailable = choice.condition ? evaluateCondition ? evaluateCondition(choice.condition) : false : true;
        if (wasAvailable !== isAvailable) {
          item.dataset.available = isAvailable ? "true" : "false";
          item.style.opacity = isAvailable ? "1" : "0.45";
          item.style.cursor = isAvailable ? "pointer" : "not-allowed";
          item.style.pointerEvents = isAvailable ? "auto" : "none";
          item.style.background = isAvailable ? "rgba(26, 35, 50, 0.75)" : "rgba(26, 35, 50, 0.4)";
        }
      });
    },
    /** 销毁 */
    destroy() {
      cleanupFns.forEach((fn) => fn());
      cleanupFns.length = 0;
      if (wrapper.parentNode) {
        wrapper.parentNode.removeChild(wrapper);
      }
    }
  };
  if (render) {
    render(wrapper, document.body);
  }
  return api;
}

    display: "none",
    opacity: "0",
    transition: "opacity 0.3s ease",
    background: "rgba(10, 14, 26, 0.6)",
    backdropFilter: "blur(10px)",
    WebkitBackdropFilter: "blur(10px)",
    borderBottom: "1px solid rgba(129, 140, 248, 0.08)"
  });
  const inner = document.createElement("div");
  inner.className = "hud-inner";
  Object.assign(inner.style, {
    height: "100%",
    display: "flex",
    alignItems: "center",
    justifyContent: "space-between"
  });
  wrapper.appendChild(inner);
  const leftGroup = document.createElement("div");
  Object.assign(leftGroup.style, {
    display: "flex",
    alignItems: "center",
    gap: "10px"
  });
  const chapterEl = document.createElement("span");
  chapterEl.className = "hud-chapter";
  Object.assign(chapterEl.style, {
    fontSize: "12px",
    fontWeight: "600",
    color: "#a5b4fc",
    fontFamily: "system-ui, sans-serif",
    letterSpacing: "1px",
    textTransform: "uppercase"
  });
  const sceneEl = document.createElement("span");
  sceneEl.className = "hud-scene";
  Object.assign(sceneEl.style, {
    fontSize: "12px",
    color: "#94a3b8",
    fontFamily: "system-ui, sans-serif"
  });
  const sep = document.createElement("span");
  sep.textContent = "/";
  Object.assign(sep.style, {
    fontSize: "12px",
    color: "#475569"
  });
  leftGroup.appendChild(chapterEl);
  leftGroup.appendChild(sep);
  leftGroup.appendChild(sceneEl);
  inner.appendChild(leftGroup);
  const rightGroup = document.createElement("div");
  Object.assign(rightGroup.style, {
    display: "flex",
    alignItems: "center",
    gap: "10px"
  });
  const dotContainer = document.createElement("div");
  Object.assign(dotContainer.style, {
    display: "flex",
    alignItems: "center",
    gap: "6px"
  });
  const dots = {};
  CHAR_IDS.forEach((char) => {
    const dot = document.createElement("span");
    dot.className = `hud-dot hud-dot-${char.id}`;
    dot.title = char.label;
    Object.assign(dot.style, {
      width: "10px",
      height: "10px",
      borderRadius: "50%",
      display: "inline-block",
      transition: "background 0.4s ease, box-shadow 0.4s ease"
    });
    dotContainer.appendChild(dot);
    dots[char.id] = dot;
  });
  rightGroup.appendChild(dotContainer);
  inner.appendChild(rightGroup);
  function affectionColor(value) {
    if (value >= 8) return "#34d399";
    if (value >= 5) return "#a5b4fc";
    if (value >= 2) return "#94a3b8";
    return "#475569";
  }
  function affectionGlow(value) {
    if (value >= 8) return "0 0 6px rgba(52, 211, 153, 0.5)";
    return "none";
  }
  const api = {
    element: wrapper,
    show() {
      isVisible = true;
      wrapper.style.display = "block";
      wrapper.offsetHeight;
      wrapper.style.opacity = "1";
    },
    hide() {
      isVisible = false;
      wrapper.style.opacity = "0";
      setTimeout(() => {
        if (!isVisible) wrapper.style.display = "none";
      }, 300);
    },
    /** 设置场景标题 */
    setScene(chapter, scene) {
      chapterName = chapter || "";
      sceneName = scene || "";
      chapterEl.textContent = chapterName;
      sceneEl.textContent = sceneName;
    },
    /** 刷新好感度显示 */
    refreshAffections() {
      if (!flagSystem || !flagSystem.getAffection) return;
      CHAR_IDS.forEach((char) => {
        const val = flagSystem.getAffection(char.id);
        if (dots[char.id]) {
          dots[char.id].style.background = affectionColor(val);
          dots[char.id].style.boxShadow = affectionGlow(val);
        }
      });
    },
    /** 销毁 */
    destroy() {
      if (wrapper.parentNode) {
        wrapper.parentNode.removeChild(wrapper);
      }
    }
  };
  if (render) {
    render(wrapper, document.body);
  }
  return api;
}

// ui/MenuUI.js
function MenuUI(opts) {
  const { render, saveManager: saveManager2, sceneManager: sceneManager2 } = opts;
  let isOpen = false;
  let currentView = "main";
  const toggleBtn = document.createElement("button");
  toggleBtn.className = "menu-toggle-btn";
  toggleBtn.textContent = "\u2261";
  toggleBtn.title = "\u83DC\u5355";
  Object.assign(toggleBtn.style, {
    position: "fixed",
    zIndex: "70",
    width: "28px",
    height: "28px",
    border: "1px solid rgba(129, 140, 248, 0.2)",
    borderRadius: "6px",
    background: "rgba(10, 14, 26, 0.5)",
    backdropFilter: "blur(6px)",
    WebkitBackdropFilter: "blur(6px)",
    color: "#e2e8f0",
    fontSize: "18px",
    lineHeight: "1",
    cursor: "pointer",
    display: "flex",
    alignItems: "center",
    justifyContent: "center",
    transition: "all 0.2s ease",
    fontFamily: "system-ui, sans-serif",
    padding: "0"
  });
  toggleBtn.addEventListener("mouseenter", () => {
    toggleBtn.style.background = "rgba(99, 102, 241, 0.3)";
    toggleBtn.style.borderColor = "rgba(129, 140, 248, 0.4)";
  });
  toggleBtn.addEventListener("mouseleave", () => {
    toggleBtn.style.background = "rgba(10, 14, 26, 0.5)";
    toggleBtn.style.borderColor = "rgba(129, 140, 248, 0.2)";
  });
  const overlay = document.createElement("div");
  overlay.className = "menu-overlay";
  Object.assign(overlay.style, {
    position: "fixed",
    inset: "0",
    zIndex: "90",
    display: "none",
    background: "rgba(10, 14, 26, 0.7)",
    backdropFilter: "blur(8px)",
    WebkitBackdropFilter: "blur(8px)",
    alignItems: "center",
    justifyContent: "center",
    opacity: "0",
    transition: "opacity 0.25s ease"
  });
  const panel = document.createElement("div");
  panel.className = "menu-panel";
  Object.assign(panel.style, {
    background: "rgba(26, 35, 50, 0.92)",
    backdropFilter: "blur(16px)",
    WebkitBackdropFilter: "blur(16px)",
    borderRadius: "14px",
    border: "1px solid rgba(129, 140, 248, 0.15)",
    padding: "24px 28px",
    boxShadow: "0 8px 32px rgba(0,0,0,0.4)"
  });
  const contentArea = document.createElement("div");
  contentArea.className = "menu-content";
  panel.appendChild(contentArea);
  overlay.appendChild(panel);
  overlay.addEventListener("click", (e) => {
    if (e.target === overlay) close();
  });
  function renderMainMenu() {
    currentView = "main";
    contentArea.innerHTML = "";
    const title = document.createElement("h2");
    title.textContent = "\u83DC\u5355";
    Object.assign(title.style, {
      fontSize: "18px",
      fontWeight: "600",
      color: "#e2e8f0",
      fontFamily: "'Crimson Text', serif",
      textAlign: "center",
      marginBottom: "20px",
      letterSpacing: "2px"
    });
    contentArea.appendChild(title);
    const buttons = [
      { label: "\u{1F4D6} \u5B58\u6863", action: () => renderSaveView("save") },
      { label: "\u{1F4C2} \u8BFB\u6863", action: () => renderSaveView("load") },
      { label: "\u{1F3E0} \u8FD4\u56DE\u6807\u9898", action: () => {
        close();
        if (sceneManager2 && sceneManager2.returnToTitle) sceneManager2.returnToTitle();
      } }
    ];
    buttons.forEach((btn) => {
      const el = document.createElement("button");
      el.textContent = btn.label;
      Object.assign(el.style, {
        display: "block",
        width: "100%",
        padding: "10px 16px",
        marginBottom: "8px",
        border: "1px solid rgba(129, 140, 248, 0.15)",
        borderRadius: "8px",
        background: "rgba(15, 23, 42, 0.5)",
        color: "#e2e8f0",
        fontSize: "14px",
        fontFamily: "system-ui, sans-serif",
        cursor: "pointer",
        textAlign: "left",
        transition: "all 0.2s ease"
      });
      el.addEventListener("mouseenter", () => {
        el.style.background = "rgba(99, 102, 241, 0.2)";
        el.style.borderColor = "rgba(129, 140, 248, 0.3)";
      });
      el.addEventListener("mouseleave", () => {
        el.style.background = "rgba(15, 23, 42, 0.5)";
        el.style.borderColor = "rgba(129, 140, 248, 0.15)";
      });
      el.addEventListener("click", btn.action);
      contentArea.appendChild(el);
    });
  }
  function renderSaveView(mode) {
    currentView = mode;
    contentArea.innerHTML = "";
    const header = document.createElement("div");
    Object.assign(header.style, {
      display: "flex",
      alignItems: "center",
      gap: "8px",
      marginBottom: "16px"
    });
    const backBtn = document.createElement("button");
    backBtn.textContent = "\u2190";
    Object.assign(backBtn.style, {
      background: "none",
      border: "1px solid rgba(129, 140, 248, 0.2)",
      borderRadius: "6px",
      color: "#94a3b8",
      fontSize: "14px",
      padding: "4px 8px",
      cursor: "pointer"
    });
    backBtn.addEventListener("click", renderMainMenu);
    const title = document.createElement("h2");
    title.textContent = mode === "save" ? "\u5B58\u6863" : "\u8BFB\u6863";
    Object.assign(title.style, {
      fontSize: "16px",
      fontWeight: "600",
      color: "#e2e8f0",
      fontFamily: "'Crimson Text', serif"
    });
    header.appendChild(backBtn);
    header.appendChild(title);
    contentArea.appendChild(header);
    const rawSlots = saveManager2 && saveManager2.getSaveList ? saveManager2.getSaveList() : [];
    const slots = rawSlots.length > 0 ? rawSlots : [
      { slot: "auto", label: "\u81EA\u52A8\u5B58\u6863" },
      { slot: "1", label: "\u5B58\u6863\u4F4D 1" },
      { slot: "2", label: "\u5B58\u6863\u4F4D 2" },
      { slot: "3", label: "\u5B58\u6863\u4F4D 3" }
    ];
    slots.forEach((slot) => {
      const slotId = slot.slot || slot.id || "auto";
      const info = slot.exists || slot.timestamp ? slot : null;
      const slotKey = slotId;
      const slotEl = document.createElement("div");
      Object.assign(slotEl.style, {
        display: "flex",
        alignItems: "center",
        justifyContent: "space-between",
        padding: "10px 12px",
        marginBottom: "6px",
        borderRadius: "8px",
        background: info ? "rgba(15, 23, 42, 0.5)" : "rgba(15, 23, 42, 0.3)",
        border: "1px solid rgba(129, 140, 248, 0.1)",
        cursor: "pointer",
        transition: "all 0.2s ease"
      });
      const labelSpan = document.createElement("span");
      labelSpan.style.color = info ? "#e2e8f0" : "#64748b";
      labelSpan.style.fontSize = "13px";
      labelSpan.style.fontFamily = "system-ui, sans-serif";
      if (slot.id === "auto") {
        labelSpan.textContent = "\u{1F4BE} \u81EA\u52A8\u5B58\u6863";
      } else {
        labelSpan.textContent = slot.label || `\u{1F4C1} \u5B58\u6863\u4F4D ${slotKey.replace("slot", "")}`;
      }
      const infoSpan = document.createElement("span");
      infoSpan.style.color = "#64748b";
      infoSpan.style.fontSize = "11px";
      infoSpan.style.fontFamily = "system-ui, sans-serif";
      if (info) {
        const date = info.timestamp ? new Date(info.timestamp).toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }) : "--";
        const chapter = info.chapter || "--";
        infoSpan.textContent = `${date} \xB7 ${chapter}`;
      } else {
        infoSpan.textContent = "\u2014 \u7A7A \u2014";
      }
      slotEl.appendChild(labelSpan);
      slotEl.appendChild(infoSpan);
      slotEl.addEventListener("mouseenter", () => {
        slotEl.style.background = "rgba(99, 102, 241, 0.15)";
        slotEl.style.borderColor = "rgba(129, 140, 248, 0.25)";
      });
      slotEl.addEventListener("mouseleave", () => {
        slotEl.style.background = info ? "rgba(15, 23, 42, 0.5)" : "rgba(15, 23, 42, 0.3)";
        slotEl.style.borderColor = "rgba(129, 140, 248, 0.1)";
      });
      slotEl.addEventListener("click", () => {
        if (mode === "save" && saveManager2 && saveManager2.save) {
          saveManager2.save(slotKey, { currentNodeId: "", sceneId: "", sceneName: info ? info.sceneName : "", nodePreview: info ? info.nodePreview : "" });
          renderSaveView(mode);
        } else if (mode === "load" && saveManager2 && saveManager2.load && info) {
          close();
          saveManager2.load(slotKey);
        }
      });
      contentArea.appendChild(slotEl);
    });
  }
  function open() {
    isOpen = true;
    overlay.style.display = "flex";
    overlay.offsetHeight;
    overlay.style.opacity = "1";
    renderMainMenu();
  }
  function close() {
    isOpen = false;
    overlay.style.opacity = "0";
    setTimeout(() => {
      if (!isOpen) overlay.style.display = "none";
    }, 250);
  }
  toggleBtn.addEventListener("click", () => {
    if (isOpen) {
      close();
    } else {
      open();
    }
  });
  const api = {
    element: overlay,
    toggleBtn,
    open,
    close,
    toggle() {
      if (isOpen) close();
      else open();
    },
    destroy() {
      [overlay, toggleBtn].forEach((el) => {
        if (el.parentNode) el.parentNode.removeChild(el);
      });
    }
  };
  if (render) {
    render(toggleBtn, document.body);
    render(overlay, document.body);
  } else {
    document.body.appendChild(toggleBtn);
    document.body.appendChild(overlay);
  }
  return api;
}

var dialogues_default = DIALOGUES;

// main.js
var ROOT = document.getElementById("game-root") || document.body;
function mount(el, parent) {
  parent = parent || ROOT;
  parent.appendChild(el);
}
var flags = FlagSystem();
var sceneManager = SceneManager({ scenes: scenes_default, container: ROOT });
var saveManager = SaveManager({ flags });
var engine = DialogueEngine({ flags });
var dialogueNodes = Object.values(dialogues_default);
engine.loadDialogue(dialogueNodes);
var dialogBox = DialogBox({ render: mount, engine, characters: characters_default });
var choicePanel = ChoicePanel({ render: mount, engine, evaluateCondition: (cond) => flags.evaluateCondition(cond) });
var hud = HUD({ render: mount, flagSystem: flags, affectionCharacters: [
  { id: "kael", label: "\u51EF\u5C14" },
  { id: "marcus", label: "\u9A6C\u5E93\u65AF" },
  { id: "lyra", label: "\u8389\u62C9" }
] });
var menuUI = MenuUI({ render: mount, saveManager, sceneManager });
function getNextNodeId(currentId) {
  if (!currentId) return null;
  const match = currentId.match(/^([a-zA-Z]+\d*_)?(\d+)([a-z]?)$/);
  if (match) {
    const prefix = match[1] || "";
    const num = parseInt(match[2], 10);
    const suffix = match[3] || "";
    if (suffix) {
      const nextSuffix = String.fromCharCode(suffix.charCodeAt(0) + 1);
      const nextId2 = prefix + num + nextSuffix;
      if (engine.getNode(nextId2)) return nextId2;
    }
    let nextNum = num + 1;
    let nextId = prefix + nextNum;
    if (engine.getNode(nextId)) return nextId;
    const paddedNum = String(num).padStart(match[2].length, "0");
    const nextPadded = String(nextNum).padStart(match[2].length, "0");
    nextId = prefix + nextPadded;
    if (engine.getNode(nextId)) return nextId;
    const altId = prefix + num + "a2";
    if (suffix === "a" && engine.getNode(altId)) return altId;
  }
  const suffixMatch = currentId.match(/^(.+?)([a-z])$/);
  if (suffixMatch) {
    const base = suffixMatch[1];
    const lastChar = suffixMatch[2];
    const nextChar = String.fromCharCode(lastChar.charCodeAt(0) + 1);
    const nextId = base + nextChar;
    if (engine.getNode(nextId)) return nextId;
  }
  return null;
}
engine.on("sceneChange", (sceneId) => {
  const scene = sceneManager.getScene(sceneId);
  if (scene) {
    sceneManager.switchScene(sceneId);
    let chapterName = "";
    const node = engine.getCurrentNode();
    if (node) {
      const id = node.id || "";
      if (id.startsWith("pro")) chapterName = "\u5E8F\u5E55";
      else if (id.startsWith("ch1")) chapterName = "\u7B2C\u4E00\u7AE0";
      else if (id.startsWith("ch2")) chapterName = "\u7B2C\u4E8C\u7AE0";
      else if (id.startsWith("end")) chapterName = "\u7ED3\u5C40";
    }
    hud.setScene(chapterName, scene.name || "");
    hud.refreshAffections();
    saveManager.autoSave({
      currentNodeId: engine.getCurrentNode()?.id || "",
      sceneId,
      sceneName: scene.name || "",
      nodePreview: engine.getCurrentNode()?.text?.slice(0, 20) || ""
    });
  }
});
engine.on("nodeStart", (nodeData) => {
  choicePanel.hide();
  dialogBox.startNode(nodeData);
});
var processingNodeEnd = false;
engine.on("nodeEnd", (endData) => {
  if (processingNodeEnd) return;
  processingNodeEnd = true;
  try {
    const node = engine.getCurrentNode();
    if (!node) return;
    if (endData?.clicked) {
      if (node.choices && node.choices.length > 0) {
        const available = engine.getAvailableChoices();
        if (available.length > 0) {
          choicePanel.show(available);
        }
      } else {
        if (node.next) {
          engine.jump(node.next);
        } else {
          const nextId = getNextNodeId(node.id);
          if (nextId) {
            engine.jump(nextId);
          } else {
            console.log(`[Game] \u5267\u60C5\u7EC8\u70B9: ${node.id}`);
          }
        }
      }
      return;
    }
    if (node.choices && node.choices.length > 0) {
      const available = engine.getAvailableChoices();
      if (available.length > 0 && !endData?.isJump && !endData?.isEnd) {
        choicePanel.show(available);
      }
    }
  } finally {
    processingNodeEnd = false;
  }
});
engine.on("choice", (choiceData) => {
  hud.refreshAffections();
});
function startGame() {
  hud.hide();
  dialogBox.hide();
  choicePanel.hide();
  engine.start("pro_001");
  dialogBox.show();
  hud.show();
  saveManager.autoSave({
    currentNodeId: "pro_001",
    sceneId: "scene_forest",
    sceneName: "\u5E7D\u8BED\u68EE\u6797",
    nodePreview: ""
  });
}
function showTitleScreen() {
  sceneManager.setScene("scene_field");
  const titleContainer = document.createElement("div");
  titleContainer.id = "title-screen";
  Object.assign(titleContainer.style, {

    alignItems: "center",
    justifyContent: "center",
    background: "radial-gradient(ellipse at center, rgba(10, 14, 26, 0.6) 0%, rgba(10, 14, 26, 0.9) 100%)",
    cursor: "pointer",
    userSelect: "none"
  });
  const title = document.createElement("h1");
  title.textContent = "\u661F\u843D\u4E4B\u591C";
  Object.assign(title.style, {
    fontSize: "clamp(36px, 8vw, 64px)",
    fontWeight: "300",
    fontFamily: "'Crimson Text', 'Noto Serif SC', serif",
    color: "#e2e8f0",
    textShadow: "0 0 30px rgba(251, 191, 36, 0.3), 0 0 60px rgba(251, 191, 36, 0.1)",
    letterSpacing: "12px",
    marginBottom: "16px",
    animation: "titlePulse 3s ease-in-out infinite"
  });
  const subtitle = document.createElement("p");
  subtitle.textContent = "\u2014 \u661F\u8FB0\u5931\u5E8F\uFF0C\u9009\u62E9\u91CD\u5199\u547D\u8FD0 \u2014";
  Object.assign(subtitle.style, {
    fontSize: "clamp(14px, 2vw, 18px)",
    color: "#94a3b8",
    fontFamily: "system-ui, sans-serif",
    letterSpacing: "4px",
    marginBottom: "48px"
  });
  const startBtn = document.createElement("div");
  startBtn.textContent = "\u2726 \u70B9\u51FB\u5F00\u59CB \u2726";
  Object.assign(startBtn.style, {
    fontSize: "clamp(16px, 2.5vw, 22px)",
    color: "#fbbf24",
    fontFamily: "system-ui, sans-serif",
    letterSpacing: "4px",
    opacity: "0.7",
    animation: "startPulse 2s ease-in-out infinite",
    padding: "12px 32px",
    border: "1px solid rgba(251, 191, 36, 0.2)",
    borderRadius: "8px",
    transition: "all 0.3s ease"
  });
  startBtn.addEventListener("mouseenter", () => {
    startBtn.style.background = "rgba(251, 191, 36, 0.1)";
    startBtn.style.opacity = "1";
  });
  startBtn.addEventListener("mouseleave", () => {
    startBtn.style.background = "transparent";
    startBtn.style.opacity = "0.7";
  });
  startBtn.addEventListener("touchstart", () => {
    startBtn.style.background = "rgba(251, 191, 36, 0.15)";
    startBtn.style.opacity = "1";
  }, { passive: true });
  startBtn.addEventListener("touchend", () => {
    startBtn.style.background = "transparent";
    startBtn.style.opacity = "0.7";
  }, { passive: true });
  titleContainer.appendChild(title);
  titleContainer.appendChild(subtitle);
  titleContainer.appendChild(startBtn);
  ROOT.appendChild(titleContainer);
  const style = document.createElement("style");
  style.textContent = `
    @keyframes titlePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.85; } }
    @keyframes startPulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
    body { -webkit-tap-highlight-color: transparent; }
  `;
  ROOT.appendChild(style);
  const handleStart = () => {
    titleContainer.style.opacity = "0";
    titleContainer.style.transition = "opacity 0.6s ease";
    setTimeout(() => {
      if (titleContainer.parentNode) titleContainer.parentNode.removeChild(titleContainer);
      startGame();
    }, 600);
  };
  titleContainer.addEventListener("click", handleStart);
  titleContainer.addEventListener("touchstart", (e) => {
    e.preventDefault();
  }, { passive: false });
  titleContainer.addEventListener("touchend", (e) => {
    handleStart();
  }, { passive: true });
}
showTitleScreen();
if (typeof window !== "undefined") {
  window.__game = { flags, engine, sceneManager, dialogBox, choicePanel };
}
export {
  choicePanel,
  dialogBox,
  engine,
  flags,
  hud,
  menuUI,
  saveManager,
  sceneManager
};
</script>
